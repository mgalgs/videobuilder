apiVersion: v1
kind: ServiceAccount
metadata:
  name: videobuilder-editor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: videobuilder-editor-fork-sandbox
  namespace: fork-sandbox  # where fork-sandbox's client Role lives
subjects:
  - kind: ServiceAccount
    name: videobuilder-editor
    namespace: default
roleRef:
  kind: Role
  name: fork-sandbox-client
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: videobuilder-editor-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: videobuilder-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: videobuilder-editor
  template:
    metadata:
      labels:
        app: videobuilder-editor
    spec:
      serviceAccountName: videobuilder-editor
      # The editor drains for up to 45s on SIGTERM; the default 30s would cut that short.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/videobuilder-bwrap.json
      containers:
        - name: editor
          image: registry.example.com/videobuilder/editor:replace-me
          imagePullPolicy: IfNotPresent
          command: ["tini", "--", "/opt/videobuilder/deploy/start-editor.sh"]
          args: ["--host", "0.0.0.0", "--port", "8100", "--allow-host", "editor.example.com", "--state-dir", "/var/tmp/claude-scratch/editor-state"]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: editor-agent-credential
                  key: api-key
          ports:
            - containerPort: 8100
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/tmp/claude-scratch
            - name: state
              mountPath: /home/editor/src
              subPath: projects
            - name: forge
              mountPath: /run/forge
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: videobuilder-editor-state
        - name: forge
          secret:
            secretName: editor-forge-ssh
            optional: true
            defaultMode: 0440  # root-owned, group = fsGroup: 0400 is unreadable to uid 1000
---
apiVersion: v1
kind: Service
metadata:
  name: videobuilder-editor
spec:
  selector:
    app: videobuilder-editor
  ports:
    - port: 80
      targetPort: 8100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: videobuilder-editor
spec:
  rules:
    - host: editor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: videobuilder-editor
                port:
                  number: 80
