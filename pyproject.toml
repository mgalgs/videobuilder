[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videobuilder"
version = "0.1.84"
description = "A small, dependency-light framework for making videos in code (cairo + Pango + ffmpeg)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
# System packages are also needed: ffmpeg, cairo and Pango (with GObject
# introspection data). See README.md for per-platform install commands.
dependencies = [
    "pycairo",
    "PyGObject",
    "Pillow",
]

[project.optional-dependencies]
# `python -m videobuilder say` (narration). Rendering never needs it.
speech = ["kokoro-onnx>=0.4.7,<0.5"]

[project.scripts]
videobuilder = "videobuilder.cli:main"

[tool.setuptools.packages.find]
include = ["videobuilder*"]

[tool.setuptools.package-data]
videobuilder = ["*.html", "*.js", "*.css"]
